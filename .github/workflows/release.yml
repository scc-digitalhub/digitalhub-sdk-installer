name: Release on PyPI and GitHub

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch
          - upgrade-beta
          - new-beta-major
          - new-beta-minor
          - new-beta-patch
          - final
      skip-pypi:
        description: "If true, skip publishing to PyPI"
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  bumpver-pyproject:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.current-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bumpver
        run: python -m pip install bumpver

      - name: Bump package version
        run: bash ./.github/scripts/bump.sh "${{ inputs.release-type }}"

      - name: Get current version
        id: current-version
        run: |
          version=$(bumpver show -n --environ | sed -n 's/^CURRENT_VERSION=//p')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Commit and push version
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "bump: new version ${{ steps.current-version.outputs.version }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  build-n-publish:
    name: Build and publish to PyPI
    if: ${{ !inputs.skip-pypi }}
    needs: bumpver-pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  tag-and-release:
    name: Create GitHub release
    needs: [bumpver-pyproject, build-n-publish]
    if: ${{ always() && needs.bumpver-pyproject.result == 'success' && (needs.build-n-publish.result == 'success' || inputs.skip-pypi) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install git-cliff
        run: python -m pip install git-cliff

      - name: Generate changelog
        env:
          VERSION: ${{ needs.bumpver-pyproject.outputs.version }}
          BETA: ${{ inputs.release-type == 'upgrade-beta' || startsWith(inputs.release-type, 'new-beta') }}
        run: bash ./.github/scripts/changelog.sh "$VERSION" "$BETA"

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ needs.bumpver-pyproject.outputs.version }}
          tag_name: ${{ needs.bumpver-pyproject.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ inputs.release-type == 'upgrade-beta' || startsWith(inputs.release-type, 'new-beta') }}
