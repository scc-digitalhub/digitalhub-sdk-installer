[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digitalhub-installer"
version = "0.16.0"
description = "Meta-package for installing the Digitalhub SDK and runtimes"
readme = "README.md"
authors = [
    { name = "Fondazione Bruno Kessler", email = "digitalhub@fbk.eu" },
    { name = "Matteo Martini", email = "mmartini@fbk.eu" }
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["data", "dataops", "kubernetes"]
requires-python = ">=3.10, <3.15"
dependencies = [
    "digitalhub[full]>=0.16.0, <0.17",
]

[project.optional-dependencies]
basic = [
    "digitalhub-runtime-python>=0.16.0, <0.17",
    "digitalhub-runtime-container>=0.16.0, <0.17",
    "digitalhub-runtime-modelserve>=0.16.0, <0.17",
]
all = [
    "digitalhub-runtime-python>=0.16.0, <0.17",
    "digitalhub-runtime-container>=0.16.0, <0.17",
    "digitalhub-runtime-modelserve>=0.16.0, <0.17",
    "digitalhub-runtime-dbt>=0.16.0, <0.17",
    "digitalhub-runtime-flower>=0.16.0, <0.17",
    "digitalhub-runtime-hera>=0.16.0, <0.17",
    "digitalhub-runtime-hydra>=0.16.0, <0.17",
    "digitalhub-runtime-ray>=0.16.0, <0.17",
    "digitalhub-runtime-servicegraph>=0.16.0, <0.17",
    "digitalhub-runtime-tvm>=0.16.0, <0.17",
]

[project.urls]
Homepage = "https://github.com/scc-digitalhub/digitalhub-sdk-installer"

[tool.hatch.build.targets.wheel]
only-include = ["LICENSE"]

[tool.bumpver]
current_version = "0.16.0"
version_pattern = "MAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "Bump version {old_version} -> {new_version}"
commit = false
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']
